<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>תוכנית הברקודים</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/userStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <script>
    var currentDate = getTodayDate();
    var currentDateTime = getTodayDateTime();
    var students = ""
    var uniqTasks = ""
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var step
    var studentResult = ""
    var result = "";
    var fileName
    const Steps = {
      step1: "1",
      step2: "2",
      step3: "3"
    };
    var classesPoints = ""
    var defaultClassesPoints = [
      { "code": 100, "name": "כיתה ט'1", "points": 100, "color": "#00a597" },
      { "code": 101, "name": "כיתה ט'2", "points": 200, "color": "#ff9800" },
      { "code": 102, "name": "כיתה ט'3", "points": 10, "color": "#e91e63" },
      { "code": 103, "name": "כיתה י'1", "points": 50, "color": "#4caf50" },
      { "code": 104, "name": "כיתה י'2", "points": 40, "color": "#3f51b5" }
    ]

    function onLoad() {
      classesPoints = JSON.parse(localStorage.getItem("classesPoints"));
      if (classesPoints == null) {
        localStorage.setItem("classesPoints", JSON.stringify(defaultClassesPoints));
        classesPoints = defaultClassesPoints;
      }
      step = Steps.step1;
      updateLines("!ברוכות הבאות", "?...מי הכיתה המנצחת");
      fileName = 'systemConfig';
      window.expose.SendExcel("sendReadExcel", fileName);
      window.expose.ReceiveExcel("receiveReadExcel" + fileName, (data) => {
        if (data == 0) {
          systemConfig = getDefaultConfig();
        } else {
          systemConfig = JSON.parse(data);
        }
        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
        document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);
      });
      fileName = 'students';
      window.expose.SendExcel("sendReadExcel", fileName);
      window.expose.ReceiveExcel("receiveReadExcel" + fileName, (data) => {
        if (data != 0) {
          students = JSON.parse(data);
        }
      });

      renderClassCards(); // Render cards for the classes
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (step == Steps.step1) {
            if (searchVal == '999999999')
              login('../main/manage');
            else if (searchVal == '011429519')
              login('../main/system');
            else if (searchVal == '207594581')
              login('../parentsMeeting/user');
            else
              searchInExcel(); //בת
          }
        }
      } else {
        buffer += e.key;
      }
    });

    function searchInExcel() {
      step = Steps.step2;
      for (var i = 0; i < students.length; i++) {
        if (students[i]["tz"] == searchVal) {
          studentResult = students[i];
          break;
        }
      }
      if (studentResult == "") {
        showAlert("הברקוד לא מופיע ברשימות. גשו למורה!");
        return;
      }
      saveData();
    }

    function saveData() {
      for (var i = 0; i < classesPoints.length; i++) {
        if (classesPoints[i]["code"] == studentResult.class) {
          classesPoints[i]["points"] += 10;
          updateLines("(:כל הכבוד ל" + studentResult.name + " " + "מ" + studentResult.grade, "!עד כה צברתן " + classesPoints[i]["points"] + " נקודות");
          localStorage.setItem("classesPoints", JSON.stringify(classesPoints));
          renderClassCards();
          break;
        }
      }
      reset(3000);
    }

    function reset(time = 0) {
      setTimeout(function () {
        step = Steps.step1;
        updateLines("!ברוכות הבאות", "?...מי הכיתה המנצחת");
      }, time);
    }

    function updateLines(line1Text, line2Text, line3Text = "") {
      document.getElementById("line1").innerHTML = line1Text;
      document.getElementById("line2").innerHTML = line2Text;
      document.getElementById("line3").innerHTML = line3Text;
    }

    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $(document).ready(function () {
        $('#modal').modal('show');
      });
      setTimeout(function () {
        $(document).ready(function () {
          $('#modal').modal('hide');
        });
        reset(0);
      }, 2500);
    }

    function renderClassCards() {
      const cardsContainer = document.getElementById('cards-container');
      cardsContainer.innerHTML = '';
      cardsContainer.className = 'd-flex flex-column align-items-center';
      // מיון כל הכיתות מהגבוה לנמוך
      const sortedClasses = [...classesPoints].sort((a, b) => b.points - a.points);
      sortedClasses.forEach((classData) => {
        const card = document.createElement('div');
        card.className = 'class-card mb-3';
        card.style.background = '#f8f9fa';
        card.style.border = '3px solid ' + (classData.color || '#00a597');
        card.style.borderRadius = '18px';
        card.style.margin = '10px 0';
        card.style.minWidth = '180px';
        card.style.maxWidth = '240px';
        card.style.width = '100%';
        card.style.textAlign = 'center';
        card.style.boxShadow = '0 2px 8px ' + (classData.color || '#00a597') + '33';
        card.style.transition = 'transform 0.2s';
        card.onmouseover = () => card.style.transform = 'scale(1.04)';
        card.onmouseout = () => card.style.transform = 'scale(1)';
        const cardTitle = document.createElement('div');
        cardTitle.className = 'class-title';
        cardTitle.textContent = classData.name;
        cardTitle.style.fontSize = '1.2rem';
        cardTitle.style.fontWeight = 'bold';
        cardTitle.style.color = classData.color || '#00a597';
        cardTitle.style.marginBottom = '0.5rem';
        const cardPoints = document.createElement('div');
        cardPoints.className = 'class-points';
        cardPoints.textContent = classData.points;
        cardPoints.style.fontSize = '2rem';
        cardPoints.style.color = classData.color || '#ff9800';
        cardPoints.style.fontWeight = 'bold';
        card.appendChild(cardTitle);
        card.appendChild(cardPoints);
        cardsContainer.appendChild(card);
      });
      renderChart();
    }

    let chartInstance;
    function renderChart() {
      const ctx = document.getElementById('pointsChart').getContext('2d');
      const labels = classesPoints.map(c => c.name);
      const data = classesPoints.map(c => c.points);
      const colorMap = {};
      classesPoints.forEach(c => { colorMap[c.name] = c.color || '#00a597'; });
      const barColors = classesPoints.map(c => colorMap[c.name]);
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'נקודות',
              data: data,
              backgroundColor: barColors,
              borderWidth: 2,
              borderRadius: 18,
              maxBarThickness: 60,
              datalabels: {
                anchor: 'end',
                align: 'end',
                color: '#333',
                font: { weight: 'bold', size: 18 },
                formatter: function (value) { return value; }
              }
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: 'גרף ניקוד כיתות',
              color: '#00a597',
              font: { size: 20 }
            },
            tooltip: {
              enabled: true,
              callbacks: {
                label: function (context) {
                  return context.label + ': ' + context.parsed.y + ' נקודות';
                }
              }
            },
            datalabels: {
              display: true,
              color: '#333',
              font: { weight: 'bold', size: 18 },
              formatter: function (value) { return value; }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { color: '#00a597', font: { size: 16 } },
              grid: { color: '#e0e0e0' }
            },
            x: {
              ticks: { color: '#00a597', font: { size: 14 } },
              grid: { display: false }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

  </script>

  <div class="background" id="background">
    <div class="text">
      <div id="line1"></div>
      <div id="line2"></div>
      <div id="line3"></div>
      <br>
      <div class="d-flex flex-row justify-content-center align-items-start" style="direction: rtl;">
        <div style="min-width:220px; width:260px; margin-left: 5%;">
          <div id="cards-scroll"
            style="max-height:480px; overflow-y:auto; overflow-x:hidden; direction:ltr; scrollbar-width:thin;">
            <div id="cards-container" class="d-flex flex-column align-items-center"></div>
          </div>
        </div>
        <div id="chart-container">
          <canvas id="pointsChart"
            style="background:#fff;direction:ltr; display:block; margin:auto; border-radius:18px; box-shadow:0 2px 8px #00a59733; padding:25px; width: 1000px; height: 500px;"
            ></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Cards Container -->

  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
  <style>
    #cards-scroll {
      direction: rtl;
      scrollbar-width: thin;
    }

    #cards-scroll::-webkit-scrollbar {
      width: 8px;
      background: #e0e0e0;
    }

    #cards-scroll::-webkit-scrollbar-thumb {
      background: #00a597;
      border-radius: 8px;
    }

    #cards-scroll {
      scrollbar-gutter: right;
    }
  </style>
</body>

</html>
